[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-transactions"
version = "1.0.0"
description = "Pipeline de traitement de transactions financieres (CSV -> SQLite)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
pipeline-transactions = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "tests"]
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
show_error_codes = true

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
